name: Build WebDriverAgent IPA
on:  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout WebDriverAgent
        run: |
          git clone https://github.com/appium/WebDriverAgent.git
          cd WebDriverAgent

      - name: Build WebDriverAgent (Strict ARM64)
        run: |
          cd WebDriverAgent
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            -allowProvisioningUpdates \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            ARCHS="arm64" \
            VALID_ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=YES \
            | tail -50

      - name: Package IPA (Strip Architectures & Preserve Symlinks)
        run: |
          cd WebDriverAgent
          APP_PATH=$(find ./build -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          
          mkdir -p Payload
          cp -rp "$APP_PATH" Payload/
          
          # Force extract only the arm64 architecture from the main executable (Crucial for Error 175)
          EXEC_PATH="Payload/WebDriverAgentRunner-Runner.app/WebDriverAgentRunner-Runner"
          if lipo -info "$EXEC_PATH" | grep -q "Non-fat"; then
            echo "Binary is already thin."
          else
            echo "Stripping fat binary down to arm64 only..."
            lipo "$EXEC_PATH" -thin arm64 -output "$EXEC_PATH"
          fi
          
          # Compress with symlinks preserved
          zip -qry WebDriverAgent-iOS15.ipa Payload/
          
          echo "IPA created successfully!"
          ls -la WebDriverAgent-iOS15.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-iOS15
          path: WebDriverAgent/WebDriverAgent-iOS15.ipa
          retention-days: 30
