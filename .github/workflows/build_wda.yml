name: Build WebDriverAgent IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s $(ls -d /Applications/Xcode_15*.app/Contents/Developer 2>/dev/null | head -1) || true

      - name: Checkout WebDriverAgent
        run: git clone --depth 1 https://github.com/appium/WebDriverAgent.git

      - name: Build WebDriverAgent
        run: |
          cd WebDriverAgent
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            | tail -30

      - name: Package IPA
        run: |
          cd WebDriverAgent
          APP=$(find ./DerivedData -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          echo "Found: $APP"
          if [ -z "$APP" ]; then echo "FAIL: app not found"; exit 1; fi
          mkdir -p Payload
          cp -rp "$APP" Payload/
          cd Payload && zip -qry ../WebDriverAgent-iOS15.ipa . && cd ..
          ls -la WebDriverAgent-iOS15.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-iOS15
          path: WebDriverAgent/WebDriverAgent-iOS15.ipa
          retention-days: 30
